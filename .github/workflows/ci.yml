name: CI

on:
  push:
    branches:
      - main
      - Test_branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Lint is part of validation; warnings are fine, lint errors are not.
      - run: npm run lint
