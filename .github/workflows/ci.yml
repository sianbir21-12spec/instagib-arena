name: CI
on:
  push:
    branches: [main, Test_branch, mobile-friendly-v2]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      # Firebase was added after the existing lockfile was generated.
      # npm install refreshes the lock graph before validation.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
