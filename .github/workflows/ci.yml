name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # package.json may intentionally be ahead of the lockfile while Firebase
      # dependencies are being introduced; npm install reconciles the lockfile.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
        continue-on-error: true
